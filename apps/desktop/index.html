<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PeerComms Desktop</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Main navigation">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">PC</span>
          <div>
            <strong>PeerComms</strong>
            <span>Local node</span>
          </div>
        </div>
        <nav class="nav-list">
          <a href="#identity" class="nav-item is-active">Identity</a>
          <a href="#contacts" class="nav-item">Contacts</a>
          <a href="#messages" class="nav-item">Messages</a>
          <a href="#events" class="nav-item">Events</a>
          <a href="#settings" class="nav-item">Settings</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <h1>PeerComms Console</h1>
            <span id="connectionSummary" class="subtle">Disconnected</span>
          </div>
          <div class="status-strip">
            <span id="apiStatus" class="status-pill status-idle">API idle</span>
            <button id="refreshAll" class="primary-button" type="button">Refresh</button>
          </div>
        </header>

        <section id="settings" class="workspace-panel settings-panel">
          <div class="panel-heading">
            <h2>Settings</h2>
          </div>
          <form id="settingsForm" class="settings-grid">
            <label>
              <span>Local API URL</span>
              <input id="baseUrl" name="baseUrl" autocomplete="off" spellcheck="false">
            </label>
            <label>
              <span>Bearer token</span>
              <input id="apiToken" name="apiToken" autocomplete="off" spellcheck="false">
            </label>
            <button class="primary-button" type="submit">Save</button>
          </form>
        </section>

        <div class="dashboard-grid">
          <section id="identity" class="workspace-panel">
            <div class="panel-heading">
              <h2>Identity</h2>
              <button id="loadIdentity" type="button">Load</button>
            </div>
            <pre id="identityOutput" class="json-output">{}</pre>
          </section>

          <section class="workspace-panel">
            <div class="panel-heading">
              <h2>Integration</h2>
            </div>
            <form id="registerAppForm" class="stack-form">
              <label>
                <span>App name</span>
                <input name="name" value="Desktop">
              </label>
              <button type="submit">Register app</button>
            </form>
            <form id="tokenForm" class="stack-form">
              <label>
                <span>App ID</span>
                <input name="appId" placeholder="app_...">
              </label>
              <label>
                <span>Scopes</span>
                <input name="scopes" value="messages:send notifications:subscribe">
              </label>
              <button type="submit">Create token</button>
            </form>
          </section>
        </div>

        <div class="content-grid">
          <section id="contacts" class="workspace-panel">
            <div class="panel-heading">
              <h2>Contacts</h2>
              <button id="loadContacts" type="button">Load</button>
            </div>
            <form id="contactRequestForm" class="stack-form">
              <label>
                <span>Local peer</span>
                <input name="localPeerId" placeholder="pc_...">
              </label>
              <label>
                <span>Remote peer</span>
                <input name="remotePeerId" placeholder="pc_...">
              </label>
              <label>
                <span>Message</span>
                <input name="message" placeholder="Optional">
              </label>
              <button type="submit">Send request</button>
            </form>
            <div id="contactsList" class="item-list"></div>
          </section>

          <section id="messages" class="workspace-panel message-panel">
            <div class="panel-heading">
              <h2>Messages</h2>
              <button id="loadConversations" type="button">Load</button>
            </div>
            <div class="split-panel">
              <div id="conversationList" class="item-list"></div>
              <div class="message-compose">
                <form id="directMessageForm" class="stack-form">
                  <label>
                    <span>From peer</span>
                    <input name="fromPeerId" placeholder="pc_...">
                  </label>
                  <label>
                    <span>To peer</span>
                    <input name="toPeerId" placeholder="pc_...">
                  </label>
                  <label>
                    <span>Text</span>
                    <textarea name="text" rows="5" placeholder="Write a direct message"></textarea>
                  </label>
                  <button class="primary-button" type="submit">Queue message</button>
                </form>
                <pre id="messagesOutput" class="json-output">{}</pre>
              </div>
            </div>
          </section>
        </div>

        <section id="events" class="workspace-panel">
          <div class="panel-heading">
            <h2>Events</h2>
            <div class="button-row">
              <button id="connectEvents" type="button">Connect</button>
              <button id="clearEvents" type="button">Clear</button>
            </div>
          </div>
          <div id="eventFeed" class="event-feed"></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
